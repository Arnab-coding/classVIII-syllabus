const s=document.getElementById("sub"),e=document.getElementById("exam"),o=document.getElementById("out");
s.innerHTML='<option value="">Select subject…</option>'+Object.keys(D).map(k=>`<option>${k}</option>`).join("");
e.innerHTML='<option value="">Select examination…</option>'+EX.map((k,i)=>`<option value="${i}">${k}</option>`).join("");
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function show(){
 if(!s.value||e.value===""){o.innerHTML='<div class="hint">📚 Choose a subject and an examination to see the syllabus.</div>';return}
 const items=D[s.value][+e.value];
 const body=items.length?"<ul>"+items.map(t=>t[0]==="#"?`<li class="h">${esc(t.slice(1))}</li>`:`<li>${esc(t)}</li>`).join("")+"</ul>":'<div class="empty">No syllabus is listed for this subject in this examination.</div>';
 o.innerHTML=`<div class="res"><div class="top"><h2>${esc(s.value)}</h2><span>${EX[+e.value]}</span></div>${body}</div>`;
}
s.onchange=e.onchange=show;show();
